pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    maven { url 'https://repository.axelor.com/nexus/repository/maven-public/' }
  }
  plugins {
    id 'com.axelor.app' version '8.2.+'
  }
}

dependencyResolutionManagement {
  repositories {
    mavenCentral() {
      content {
        excludeGroup 'com.axelor'
      }
    }
    maven { url 'https://repository.axelor.com/nexus/repository/maven-public/' }
  }
}

rootProject.name = 'axelor-jbl'
