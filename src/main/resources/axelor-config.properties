# ---------------------------------------------------------------------------
# JBL Atelier - configuration Axelor Open Platform (V0)
# Fichier lu au démarrage ; peut être surchargé par -Daxelor.config=<chemin>
# ---------------------------------------------------------------------------

application.name        = JBL Atelier
application.description = Atelier de réparation de matériel de jardinage
application.version     = 0.1.0
application.mode        = dev
application.locale      = fr

# Base de données (PostgreSQL) - à adapter selon l'environnement
db.default.dialect  = org.hibernate.dialect.PostgreSQLDialect
db.default.driver   = org.postgresql.Driver
db.default.ddl      = update
db.default.url      = jdbc:postgresql://localhost:5432/axelor_jbl
db.default.user     = axelor
db.default.password = axelor
