# ---------------------------------------------------------------------------
# JBL Atelier - configuration Axelor Open Platform (V0)
# Fichier lu au démarrage ; peut être surchargé par -Daxelor.config=<chemin>
# ---------------------------------------------------------------------------

application.name        = JBL Atelier
application.description = Atelier de réparation de matériel de jardinage
application.version     = 0.1.0
application.mode        = dev
application.locale      = fr-FR

# Base de données (PostgreSQL) - à adapter selon l'environnement
db.default.dialect  = org.hibernate.dialect.PostgreSQLDialect
db.default.driver   = org.postgresql.Driver
db.default.ddl      = update
# Dev local : la DB docker est publiée sur le port hôte 5433 (5432 souvent occupé par un tunnel SSH).
# dev.sh ajuste automatiquement via AXELOR_CONFIG_DB_DEFAULT_URL si le port est pris.
db.default.url      = jdbc:postgresql://localhost:5433/axelor_jbl
db.default.user     = axelor
db.default.password = axelor

# Auth basic pour l API REST (utile en dev/test ; a retirer en prod) :
# auth.local.basic-auth = indirect, direct

# Contexte script __config__.app (utilisé par les menus des modules AOS :
# __config__.app.isApp('sale')...). Standard AOS webapp.
context.app = com.axelor.studio.app.service.ScriptAppService
