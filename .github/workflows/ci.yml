name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write # push des images sur GHCR (ghcr.io/<owner>/<repo>)

env:
  GRADLE_VERSION: 8.14.3
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # 1. Compilation, tests et production du WAR
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: gradle build (compile + tests + war)
        run: gradle --no-daemon --console=plain clean build

  # 2. Image Docker poussée sur GHCR (uniquement sur push, pas sur PR)
  docker:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GRADLE_VERSION=${{ env.GRADLE_VERSION }}

  # 3. Smoke test : démarrage complet via docker compose (push sur main uniquement)
  smoke:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Démarrer la stack (app + PostgreSQL)
        run: docker compose up -d --build

      - name: Attendre le démarrage de l'application
        run: |
          for i in $(seq 1 80); do
            if curl -fsS -o /dev/null http://localhost:8080/; then
              echo "Application démarrée (itération $i)"
              exit 0
            fi
            sleep 15
          done
          echo "::error::L'application ne répond pas après 20 min"
          docker compose logs --tail=200 app
          exit 1

      - name: Vérifier la page de login
        run: |
          curl -fsS http://localhost:8080/ | grep -qi axelor
          echo "OK: page servie"

      - name: Teardown
        if: always()
        run: docker compose down -v
