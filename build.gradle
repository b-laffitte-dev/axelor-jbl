plugins {
  id 'com.axelor.app'
}

axelor {
  title       = 'JBL Atelier'
  description = "V0 - Gestion d'atelier de réparation de matériel de jardinage (tondeuses, tronçonneuses, etc.)"
}

allprojects {
  group = 'com.axelor.apps.jbl'
  version = '0.1.0'

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(21)
    }
  }

  afterEvaluate {
    test {
      useJUnitPlatform()
    }
  }
}

// Nom stable du WAR produit (repris tel quel dans le Dockerfile)
war {
  archiveFileName = 'axelor-jbl.war'
}

dependencies {
  // Modules métier Axelor (AOS 9.x, construits sur AOP 8.2) — même version que la plateforme
  // (axelorBaseVersion = 9.x, voir gradle.properties) : tous publiés sur repository.axelor.com.
  // - axelorBaseVersion (9.x) est la version des modules publiés com.axelor.apps:*, indépendante de la
  //   version de la plateforme embarquée par le plugin com.axelor.app (8.2.6, voir settings.gradle).
  // - axelor-base 9.x embarque déjà les addons jakarta (axelor-utils 4.x, axelor-studio 4.x) requis
  //   par Tomcat 10.1 / Jakarta EE 10.
  // - Exclusion de org.codehaus.groovy (groovy-all 3.x legacy des POM AOS) : AOP 8.2 embarque
  //   déjà org.apache.groovy 4.x via axelor-core, les deux entrent en conflit de capacité Gradle.
  def aos = { String module ->
    implementation("com.axelor.apps:${module}:${axelorBaseVersion}") {
      exclude group: 'org.codehaus.groovy'
    }
  }

  // Strict nécessaire pour le module JBL (vérifié par grep des imports/domains + graphe POM) :
  // - axelor-base    : Partner, Product, Company, User, Sequence, App, Permission (indispensable)
  // - axelor-sale    : SaleOrder / SaleOrderLine (devis) — tire axelor-crm en transitif (léger)
  // - axelor-account : Invoice / InvoiceLine (facture)
  // - axelor-stock   : StockMove / StockLocation (consommation pièces)
  // - axelor-purchase : OBLIGATOIRE bien que non référencé par le code JBL — axelor-stock contient
  //   la vue d'extension views/CallTenderSupplier.xml (model=com.axelor.apps.purchase.db.CallTenderSupplier) ;
  //   sans le jar purchase, ViewLoader lève "Invalid view, model not found" pendant l'installation de
  //   stock, ce qui aborte la boucle d'installation et empêche axelor-jbl d'être installé.
  //   axelor-purchase ne dépend que de axelor-base (aucun module supplychain/contract tiré).
  // Retirés : axelor-intervention (remplacé par JblEquipment custom — sinon il tire
  // contract + human-resource + project + bank-payment + supplychain + purchase),
  // axelor-supplychain (pont OR -> StockMove -> Invoice fait par le service JBL).
  aos 'axelor-base'
  aos 'axelor-sale'
  aos 'axelor-account'
  aos 'axelor-stock'
  aos 'axelor-purchase'

  // Driver JDBC PostgreSQL embarqué dans le WAR (AOP ne le fournit pas)
  runtimeOnly 'org.postgresql:postgresql:42.7.14'
}
